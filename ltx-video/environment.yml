name: noiseasier-ltx-video
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=12.1
  - ffmpeg
  - pip
  # OpenAI CLIP still imports pkg_resources, removed in newer setuptools.
  - setuptools<81
  - pip:
      - clip @ git+https://github.com/openai/CLIP.git@a1d071733d7111c9c014f024669f959182114e33
      - accelerate==1.3.0
      - av==12.3.0
      - diffusers==0.32.2
      - einops==0.8.0
      - huggingface-hub==0.30.2
      - hpsv2==1.2.0
      - image-reward==1.5
      - imageio==2.37.0
      - imageio-ffmpeg==0.6.0
      - kornia==0.8.0
      - numpy==1.26.4
      - open-clip-torch==2.24.0
      - protobuf==3.20.3
      - safetensors==0.5.2
      - sentencepiece==0.2.0
      # ImageReward 1.5 pins timm 0.6.13; LTX itself accepts an unpinned timm.
      - timm==0.6.13
      - transformers==4.50.1
      - tqdm==4.67.1
